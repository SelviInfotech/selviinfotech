<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      position: relative;
    }

    /* Grid background */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(212,175,55,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,175,55,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Radial glow */
    .glow {
      position: absolute;
      top: -150px;
      left: -150px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(212,175,55,0.18) 0%, transparent 65%);
      pointer-events: none;
    }
    .glow-right {
      position: absolute;
      bottom: -200px;
      right: -100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212,175,55,0.10) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Gold top bar */
    .gold-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #d4af37, #f5d060, #d4af37, transparent);
    }

    /* Content */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      height: 100%;
      align-items: center;
      padding: 0 80px;
      gap: 60px;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(212,175,55,0.12);
      border: 1px solid rgba(212,175,55,0.3);
      color: #d4af37;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 100px;
      width: fit-content;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #d4af37;
      border-radius: 50%;
    }

    .headline {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1px;
      color: #ffffff;
    }

    .headline .gold {
      background: linear-gradient(135deg, #d4af37, #f5d060, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      max-width: 480px;
    }

    .services-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .service-tag {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .right {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      flex-shrink: 0;
    }

    .logo-card {
      width: 260px;
      height: 260px;
      background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 0 60px rgba(212,175,55,0.12), inset 0 1px 0 rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }

    .logo-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.5), transparent);
    }

    .logo-card img {
      width: 130px;
      height: auto;
    }

    .logo-label {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      letter-spacing: 0.5px;
    }

    .stats-row {
      display: flex;
      gap: 20px;
    }

    .stat-box {
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      min-width: 70px;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 700;
      color: #d4af37;
      display: block;
    }

    .stat-lbl {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
      display: block;
    }

    /* Domain watermark */
    .domain {
      position: absolute;
      bottom: 28px;
      right: 80px;
      font-size: 15px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.5px;
      z-index: 10;
    }

    .domain span {
      color: rgba(212,175,55,0.6);
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="glow-right"></div>
  <div class="gold-bar"></div>

  <div class="content">
    <div class="left">
      <div class="badge">Premium IT Solutions</div>
      <div class="headline">
        Crafting Digital<br>
        <span class="gold">Excellence</span>
      </div>
      <p class="subtitle">
        Custom software, mobile apps, web maintenance,<br>
        training & IT consulting — Tamil Nadu, India.
      </p>
      <div class="services-row">
        <span class="service-tag">Software Dev</span>
        <span class="service-tag">Mobile Apps</span>
        <span class="service-tag">IT Training</span>
        <span class="service-tag">Consulting</span>
      </div>
    </div>

    <div class="right">
      <div class="logo-card">
        <img src="logo.png" alt="Selvi Infotech">
        <div class="logo-label">Selvi Infotech Pvt. Ltd.</div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-val">50+</span>
          <span class="stat-lbl">Projects</span>
        </div>
        <div class="stat-box">
          <span class="stat-val">10K+</span>
          <span class="stat-lbl">Students</span>
        </div>
        <div class="stat-box">
          <span class="stat-val">10+</span>
          <span class="stat-lbl">Yrs Exp</span>
        </div>
      </div>
    </div>
  </div>

  <div class="domain"><span>selviinfotech</span>.com</div>
</body>
</html>
